<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="webkit" name="renderer" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport" />
    <meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control" />
    <link href="./favicon.ico" rel="icon" sizes="any" />
    <link href="./favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="./apple-touch-icon-180x180.png" rel="apple-touch-icon" />
    <title>Identity Biznes</title>
    <meta content="identity biznes, crm, nasiya, installment" name="keywords" />
    <meta content="Identity Biznes - Nasiya va to'lov boshqaruv tizimi" name="description" />
    <link href="./static/css/loading.css" rel="stylesheet" />
    <script>
      // Unregister any stale service workers from previous PWA deployments
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister()
        })
        if (window.caches) caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k) }) })
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="app-loader">
        <svg class="loader-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2563eb"/>
              <stop offset="1" stop-color="#1d4ed8"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14" fill="url(#lg)"/>
          <text x="32" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="28" fill="white" letter-spacing="-1">IB</text>
        </svg>
        <div class="loader-spinner"></div>
        <div class="loader-text">Yuklanmoqda...</div>
      </div>
    </div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
